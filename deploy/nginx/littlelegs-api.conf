map $request_method $ll_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}
limit_req_zone $ll_limit_key zone=ll_api:10m rate=2r/s;

map $http_origin $ll_cors_origin {
    default "";
    "https://littlelegs.vercel.app" $http_origin;
}

server {
    listen 80;
    server_name api.littlelegsgo.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.littlelegsgo.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.littlelegsgo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.littlelegsgo.com/privkey.pem;

    client_max_body_size 64k;
    access_log /var/log/nginx/littlelegs_access.log;

    error_page 429 = @rate_limited;
    error_page 502 503 504 = @upstream_error;

    location @rate_limited {
        default_type application/problem+json;
        add_header Access-Control-Allow-Origin $ll_cors_origin always;
        add_header Vary Origin always;
        add_header Retry-After 1 always;
        return 429 '{"type":"https://littlelegsgo.com/problems/rate-limited","title":"Too Many Requests","status":429,"code":"RATE_LIMITED","trace_id":"$request_id"}';
    }

    location @upstream_error {
        default_type application/problem+json;
        add_header Access-Control-Allow-Origin $ll_cors_origin always;
        add_header Vary Origin always;
        return 503 '{"type":"https://littlelegsgo.com/problems/service-unavailable","title":"Service Unavailable","status":503,"code":"SERVICE_UNAVAILABLE","trace_id":"$request_id"}';
    }

    location / {
        limit_req zone=ll_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 40s;
        proxy_connect_timeout 5s;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8000; access_log off; }
}
